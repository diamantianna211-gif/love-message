<!DOCTYPE html>
<html>
<head>
<title>Your surprise ❤️</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: #fff0f5;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

#dog {
  width: 300px;
  display: block; /* Κάνει την εικόνα block για να κεντραριστεί σωστά */
  margin: 0 auto; /* Κεντράρισμα οριζόντια */
  border-radius: 15px;
  opacity: 0;
  transform: scale(0.5);
  transition: opacity 2s ease, transform 2s ease;
}

#message {
  font-size: 28px;
  color: #333;
  opacity: 0;
  transition: opacity 2s ease;
  text-align: center;
  max-width: 80%;
  margin-top: 20px;
}

#hearts, #confetti {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.heart {
  position: absolute;
  color: red;
  font-size: 24px;
  animation: float 4s linear infinite;
}

@keyframes float {
  0% { transform: translateY(100vh); opacity: 1; }
  100% { transform: translateY(-10vh); opacity: 0; }
}

.confetti {
  position: absolute;
  width: 10px;
  height: 10px;
  opacity: 0.7;
  animation: confetti-fall 3s linear forwards;
}

@keyframes confetti-fall {
  0% { transform: translateY(0) rotate(0deg); }
  100% { transform: translateY(100vh) rotate(360deg); opacity:0; }
}
</style>
</head>
<body>

<img src="dog.jpg.jpeg" id="dog" alt="Dog">
<div id="message"></div>
<div id="hearts"></div>
<div id="confetti"></div>

<script>
// Κεντράρει και εμφανίζει σκύλο με zoom-in
window.onload = () => {
  const dog = document.getElementById("dog");
  setTimeout(() => {
    dog.style.opacity = 1;
    dog.style.transform = "scale(1)";
  }, 200);

  // Μήνυμα με fade-in letter-by-letter
  const msgEl = document.getElementById("message");
  const msgText = "❤️ I love you and I am so proud of you ❤️";
  let i = 0;
  function typeLetter() {
    if(i < msgText.length) {
      msgEl.innerHTML += msgText.charAt(i);
      msgEl.style.opacity = 1;
      i++;
      setTimeout(typeLetter, 50);
    }
  }
  setTimeout(typeLetter, 1500);

  // Hearts animation
  setInterval(() => {
    let heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random()*100 + "vw";
    heart.style.fontSize = (20 + Math.random()*20) + "px";
    document.getElementById("hearts").appendChild(heart);
    setTimeout(()=>heart.remove(), 4000);
  }, 300);

  // Confetti animation
  for(let j=0; j<50; j++) {
    let c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random()*100 + "vw";
    c.style.backgroundColor = ["#ff4d6d","#ffdd57","#6a0dad","#00d4ff","#ff69b4"][Math.floor(Math.random()*5)];
    document.getElementById("confetti").appendChild(c);
    setTimeout(()=>c.remove(), 3000);
  }
};
</script>

</body>
</html>
