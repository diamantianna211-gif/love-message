<!DOCTYPE html>
<html>
<head>
<title>Click for a surprise ❤️</title>
<style>
body {
  font-family: Arial; 
  margin: 0;
  padding: 0;
  height: 100vh;
  background: #fff0f5;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

h1 {
  margin-bottom: 30px;
}

#us {
  width: 300px;
  border-radius: 15px;
  opacity: 0;
  transform: scale(0.5);
  transition: opacity 2s ease, transform 2s ease;
}

button {
  margin-top: 40px;
  padding: 20px 40px;
  font-size: 22px;
  background: #ff4d6d;
  color: white;
  border: none;
  border-radius: 12px;
  cursor: pointer;
}

button:hover { background: #ff1e4d; }
</style>
</head>
<body>

<h1>Hey you ❤️</h1>
<img src="us.jpg.jpeg" alt="Us" id="us">
<button onclick="window.location.href='surprise.html'">Open your surprise</button>

<script>
// Zoom-in και fade-in για τη φωτογραφία σας
window.onload = () => {
  const us = document.getElementById("us");
  setTimeout(() => {
    us.style.opacity = 1;
    us.style.transform = "scale(1)";
  }, 200); // λίγο delay για smooth effect
};
</script>

</body>
</html>
