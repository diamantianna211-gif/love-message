<!DOCTYPE html>
<html>
<head>
<title>Click for a surprise ❤️</title>
<style>
body {
  font-family: Arial; 
  text-align: center; 
  margin: 0; 
  padding: 50px 0; 
  background: #fff0f5; 
  display: flex;
  flex-direction: column;
  align-items: center;
}

h1 {
  margin-bottom: 30px;
}

#us {
  width: 300px;
  border-radius: 15px;
  opacity: 0;
  transform: scale(0.8);
  transition: opacity 2s, transform 2s;
}

button {
  margin-top: 40px;
  padding: 20px 40px;
  font-size: 22px;
  background: #ff4d6d;
  color: white;
  border: none;
  border-radius: 12px;
  cursor: pointer;
}

button:hover { background: #ff1e4d; }
</style>
</head>
<body>

<h1>Hey you ❤️</h1>
<img src="us.jpg.jpeg" alt="Us" id="us">
<button onclick="window.location.href='surprise.html'">Open your surprise</button>

<script>
// Zoom-in και fade-in για τη φωτογραφία σας
const us = document.getElementById("us");
window.onload = () => {
  setTimeout(() => {
    us.style.opacity = 1;
    us.style.transform = "scale(1)";
  }, 100);
};
</script>

</body>
</html>
